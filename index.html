<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="epub-tts" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <title>epub-tts</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-book="none">
    <main class="screen">
      <header>
        <div class="titles">
          <div id="title" class="title"></div>
          <div id="chapter-name" class="chapter-name"></div>
        </div>
        <button id="open-book" class="icon-button" type="button" aria-haspopup="dialog" aria-label="Book" title="Book">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" /><path d="M4 21V5" /></svg>
        </button>
        <button id="open-voice" class="icon-button" type="button" aria-haspopup="dialog" aria-label="Voice and speed" title="Voice and speed">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M17 8a5 5 0 0 1 0 8" /></svg>
        </button>
        <button id="open-diagnostics" class="icon-button" type="button" aria-haspopup="dialog" aria-label="Diagnostics" title="Diagnostics">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg>
        </button>
      </header>

      <div id="welcome" class="welcome">
        <h1>epub-tts</h1>
        <p>Listen to any EPUB, read aloud on your device.</p>
        <label class="open-button" for="file">Open an EPUB</label>
      </div>

      <div class="reader">
        <div id="text"></div>
        <div id="stats">Idle.</div>
        <div class="controls">
          <div id="saved">No saved position.</div>
          <button id="primary" type="button" data-state="open" disabled>
            <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7 4.5v15l13-7.5z" /></svg>
            <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z" /></svg>
            <svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 6h12v12H6z" /></svg>
            <svg class="icon icon-resume" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5M4.5 4v4.5H9" /></svg>
            <span id="primary-label">Open an EPUB</span>
          </button>
          <button id="listen-start" type="button" class="secondary" hidden>Listen from chapter start</button>
          <audio id="audio" preload="auto" hidden></audio>
        </div>
      </div>
    </main>

    <input id="file" class="visually-hidden" type="file" accept=".epub,application/epub+zip" />

    <dialog id="sheet-book" aria-labelledby="h-book">
      <div class="sheet-head">
        <h2 id="h-book">Book and chapters</h2>
        <button class="sheet-close" type="button">Close</button>
      </div>
      <div class="sheet-body">
        <div id="book"></div>
        <label class="open-button secondary" for="file">Open another book</label>
        <div class="field">
          <label for="chapter">Chapter</label>
          <select id="chapter" disabled></select>
          <div class="row chapter-nav">
            <button id="chapter-prev" type="button" disabled>Previous chapter</button>
            <button id="chapter-next" type="button" disabled>Next chapter</button>
          </div>
        </div>
        <button id="forget-book" type="button" hidden>Forget this book</button>
      </div>
    </dialog>

    <dialog id="sheet-voice" aria-labelledby="h-voice">
      <div class="sheet-head">
        <h2 id="h-voice">Voice and speed</h2>
        <button class="sheet-close" type="button">Close</button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label for="voice">Voice</label>
          <select id="voice"></select>
        </div>
        <span id="voice-status" role="status">Checking voice...</span>
        <div class="row">
          <button id="voice-download" type="button" disabled>Download</button>
          <button id="voice-remove" type="button" disabled>Remove</button>
        </div>
        <div class="field">
          <span>Speed</span>
          <div class="speed">
            <button id="speed-down" type="button" aria-label="Slower" title="Slower">&minus;</button>
            <span id="speed-label">1.00x</span>
            <button id="speed-up" type="button" aria-label="Faster" title="Faster">+</button>
          </div>
          <button id="speed-reset" type="button">Reset to 1x</button>
        </div>
      </div>
    </dialog>

    <dialog id="diagnostics" aria-labelledby="h-diag">
      <div class="sheet-head">
        <h2 id="h-diag">Diagnostics</h2>
        <button class="sheet-close" type="button">Close</button>
      </div>
      <div class="sheet-body">
        <div class="row">
          <button id="copy-log" type="button">Copy log</button>
          <span id="copy-status" role="status"></span>
        </div>
        <pre id="log"></pre>
        <div id="app-version"></div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
