<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="epub-tts" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <title>epub-tts</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 12px; background: #111; color: #eee; line-height: 1.5; }
      h1 { font-size: 1.1rem; margin: 0 0 8px; }
      section { margin: 12px 0; padding: 10px; background: #1b1b1b; border-radius: 8px; }
      label { display: block; margin: 6px 0 2px; font-size: 0.85rem; color: #aaa; }
      select, input, button { font: inherit; padding: 8px; margin: 2px 0; max-width: 100%; }
      button { min-height: 44px; }
      audio { width: 100%; margin-top: 8px; }
      #text { max-height: 30vh; overflow-y: auto; }
      #text span { cursor: pointer; }
      #text span.current { background: #35507a; border-radius: 3px; }
      #text p { margin: 0 0 0.6em; }
      pre { margin: 0; font-size: 0.8rem; max-height: 40vh; overflow: auto; white-space: pre-wrap; word-break: break-word; -webkit-overflow-scrolling: touch; }
      details summary { cursor: pointer; font-weight: bold; min-height: 44px; display: flex; align-items: center; }
      #copy-log { min-width: 120px; }
      #chapter { flex: 1; min-width: 0; min-height: 44px; }
      #chapter-prev, #chapter-next { min-width: 44px; min-height: 44px; }
      #speed { flex: 1; min-width: 120px; min-height: 44px; }
      #speed-label { min-width: 3.5em; font-variant-numeric: tabular-nums; }
      #voice-status { font-size: 0.85rem; color: #aaa; }
      #copy-status { font-size: 0.85rem; color: #8c8; }
      footer { margin: 12px 0 0; font-size: 0.8rem; color: #888; text-align: center; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      #stats { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <h1>epub-tts</h1>

    <section>
      <div id="saved">No saved position.</div>
      <label for="file">1. Pick an EPUB file</label>
      <input id="file" type="file" accept=".epub,application/epub+zip" />
      <div id="book"></div>
      <label for="chapter">2. Pick a chapter</label>
      <div class="row">
        <button id="chapter-prev" type="button" aria-label="Previous chapter" title="Previous chapter" disabled>&#9664; Prev</button>
        <select id="chapter" disabled></select>
        <button id="chapter-next" type="button" aria-label="Next chapter" title="Next chapter" disabled>Next &#9654;</button>
      </div>
      <label for="voice">Voice</label>
      <select id="voice"></select>
      <div class="row">
        <span id="voice-status" role="status">Checking voice...</span>
        <button id="voice-download" type="button" disabled>Download</button>
        <button id="voice-remove" type="button" disabled>Remove</button>
      </div>
      <div class="row">
        <button id="generate" disabled>3. Generate chapter audio</button>
        <button id="cancel" disabled>Cancel</button>
        <button id="resume" disabled>Resume saved position</button>
      </div>
      <div id="stats">Idle.</div>
    </section>

    <section>
      <audio id="audio" controls preload="auto"></audio>
      <div class="row">
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="0.75" max="2" step="0.05" value="1" />
        <span id="speed-label">1.00x</span>
        <button id="speed-reset" type="button">Reset to 1x</button>
      </div>
      <div id="text"></div>
    </section>

    <section>
      <details id="diagnostics">
        <summary>Diagnostics</summary>
        <div class="row">
          <button id="copy-log" type="button">Copy log</button>
          <span id="copy-status" role="status"></span>
        </div>
        <pre id="log"></pre>
      </details>
    </section>

    <footer id="app-version"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
